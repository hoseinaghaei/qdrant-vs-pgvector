# Qdrant + benchmark client.
#   docker compose -f docker-compose.qdrant.yml up -d qdrant
#   docker compose -f docker-compose.qdrant.yml run --rm bench <command>
name: bench-qdrant

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-4}"
          memory: ${DB_MEMORY:-8g}

  bench:
    extends:
      file: docker/bench.yml
      service: bench
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
